spring.application.name=oficioya-users

# Credenciales
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficioya-usersdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Mensajes y errores de validación
server.error.include-message=always
server.error.include-binding-errors=always

logging.file.name=logs/oficioya-users.log

# JWT emitido por Identity
jwt.secret=${JWT_SECRET}
jwt.roles-claim=${JWT_ROLES_CLAIM:roles}

# Microservicio de Worker
workers.url=${WORKERS_URL:http://localhost:8081}

# Microservicio de Servicios
requests.url=${REQUESTS_URL:http://localhost:8081}

# Espera máxima por respuesta
http.client.timeout-seconds=${HTTP_CLIENT_TIMEOUT_SECONDS:15}

admin.email=${ADMIN_EMAIL:}
admin.name=${ADMIN_NAME:Administrador}
admin.phone=${ADMIN_PHONE:}
admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}